<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA AI ACADEMY – École d’intelligence artificielle</title>
<meta name="description" content="NOVA AI ACADEMY : formations en intelligence artificielle, plateforme d’apprentissage, certificats et accompagnement. Site de démonstration.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--navy:#142D4E;--royal:#3268B2;--gold:#D6AD63;--bg:#fff;--soft:#F3F6FA;--tx:#1b2a3f;--mut:#5b6b82;--card:#fff;--bd:#dde5ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b2e;--soft:#12243c;--tx:#e8eef7;--mut:#9fb0c8;--card:#16293f;--bd:#254163;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1b2e;--soft:#12243c;--tx:#e8eef7;--mut:#9fb0c8;--card:#16293f;--bd:#254163;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0 0 .5em}
a{color:var(--royal)}.wrap{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 0}
.logo{font:700 1.15rem Fraunces,serif;color:#fff;text-decoration:none;margin-right:auto}.logo b{color:var(--gold)}
nav a.l{color:#dbe6f5;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:.93rem}nav a.l:hover,nav a.l.on{background:rgba(255,255,255,.12);color:#fff}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 20px;font:600 .95rem Inter,sans-serif;cursor:pointer;text-decoration:none;background:var(--royal);color:#fff;transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.gold{background:var(--gold);color:#142D4E}.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:linear-gradient(135deg,#142D4E,#3268B2);color:#fff;padding:84px 0 72px}.hero h1{font-size:clamp(2rem,5vw,3.4rem);max-width:780px}.hero p{max-width:620px;color:#dbe6f5;font-size:1.1rem}
.sec{padding:60px 0}.alt{background:var(--soft)}.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(20,45,78,.14)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--royal);margin:0 6px 6px 0}.demo{background:#fff3d6;color:#6b4e12}
.stat{font:700 2.2rem Fraunces,serif;color:var(--gold)}.eyebrow{color:var(--gold);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 12px}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--royal),var(--gold))}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid var(--bd);text-align:left;font-size:.92rem}
.pf{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--royal));color:var(--gold);display:grid;place-items:center;font:700 2rem Fraunces,serif;border:3px solid var(--gold)}
footer{background:var(--navy);color:#b8c8de;padding:36px 0;font-size:.9rem}footer a{color:#dbe6f5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:20px}.modal>div{background:var(--card);border-radius:16px;padding:24px;max-width:440px;width:100%}
.cert{border:8px double var(--gold);padding:40px;text-align:center;background:#fff;color:#142D4E}
.fade{animation:f .5s ease both}@keyframes f{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body>*:not(#app),header,footer,.noprint{display:none!important}}
</style></head><body>
<header><div class="wrap"><nav aria-label="Navigation principale"><a class="l logo" href="#accueil">NOVA <b>AI</b> ACADEMY</a>
<a class="l" href="#accueil">Accueil</a><a class="l" href="#ecole">Notre école</a><a class="l" href="#formations">Formations</a><a class="l" href="#blog">Blog</a><a class="l" href="#contact">Contact</a><span id="nv"></span></nav></div></header>
<main id="app" tabindex="-1"></main>
<footer><div class="wrap"><b style="color:#fff">NOVA AI ACADEMY</b> — Site de démonstration. Contenus, prix, statistiques et témoignages fictifs, à remplacer.<br>
<a href="#legal-mentions">Mentions légales</a> · <a href="#legal-cgv">CGV</a> · <a href="#legal-confidentialite">Confidentialité</a> · <a href="#legal-cookies">Cookies</a></div></footer>
<div id="md"></div>
<script>
const $=s=>document.querySelector(s);
const C=[
{id:"intro-ia",t:"Introduction à l’intelligence artificielle",cat:"Fondamentaux",lv:"Débutant",d:"12 h",p:149,pre:"Aucun",obj:"Comprendre les concepts, usages et limites de l’IA.",mods:["Histoire et concepts","IA dans la vie réelle","Éthique et biais"],proj:"Cartographier les usages IA d’une organisation",q:[["Que signifie « IA » ?",["Intelligence artificielle","Interface avancée","Informatique appliquée"],0],["Une IA peut-elle se tromper ?",["Jamais","Oui, elle peut produire des erreurs","Seulement hors ligne"],1]]},
{id:"chatgpt-claude",t:"ChatGPT et Claude",cat:"Outils IA",lv:"Débutant",d:"10 h",p:129,pre:"Aucun",obj:"Utiliser efficacement les assistants conversationnels.",mods:["Panorama des assistants","Cas d’usage pro","Vérifier les réponses"],proj:"Construire un assistant de rédaction personnel",q:[["Faut-il vérifier les réponses d’un assistant IA ?",["Non","Oui, toujours pour les faits importants","Seulement le week-end"],1]]},
{id:"prompt",t:"Prompt Engineering",cat:"Outils IA",lv:"Intermédiaire",d:"14 h",p:179,pre:"Avoir utilisé un assistant IA",obj:"Concevoir des prompts fiables et réutilisables.",mods:["Structure d’un prompt","Exemples et contraintes","Évaluation"],proj:"Bibliothèque de prompts testés",q:[["Quel élément améliore un prompt ?",["Le contexte précis","Le hasard","Des mots plus longs"],0]]},
{id:"genai",t:"IA générative",cat:"IA générative",lv:"Intermédiaire",d:"16 h",p:199,pre:"Notions d’IA",obj:"Maîtriser texte, image et audio génératifs.",mods:["Modèles génératifs","Texte et image","Risques et droits"],proj:"Campagne créative assistée par IA",q:[["L’IA générative sert à…",["Créer du contenu","Uniquement trier des fichiers","Réparer du matériel"],0]]},
{id:"auto",t:"Automatisation avec l’IA",cat:"Productivité",lv:"Intermédiaire",d:"14 h",p:189,pre:"Notions de workflow",obj:"Automatiser des tâches répétitives.",mods:["Cartographier les tâches","Outils no-code","Mise en production"],proj:"Automatiser un flux de traitement d’e-mails",q:[["Première étape d’une automatisation ?",["Choisir un outil","Cartographier la tâche","Écrire le rapport"],1]]},
{id:"contenu",t:"Création de contenu avec l’IA",cat:"IA générative",lv:"Débutant",d:"10 h",p:139,pre:"Aucun",obj:"Produire des contenus de qualité avec l’IA.",mods:["Idéation","Rédaction et relecture","Visuels"],proj:"Calendrier éditorial complet",q:[["Que faire après une génération ?",["Publier directement","Relire et corriger","Supprimer"],1]]},
{id:"python",t:"Python",cat:"Développement",lv:"Débutant",d:"24 h",p:229,pre:"Aucun",obj:"Programmer en Python pour l’IA.",mods:["Syntaxe","Fonctions et données","Bibliothèques"],proj:"Script d’analyse de données",q:[["Quel symbole commente une ligne Python ?",["//","#","--"],1]]},
{id:"ml",t:"Machine Learning",cat:"Data & ML",lv:"Avancé",d:"30 h",p:299,pre:"Python, statistiques de base",obj:"Entraîner et évaluer des modèles.",mods:["Apprentissage supervisé","Évaluation","Déploiement"],proj:"Modèle de classification évalué",q:[["Pourquoi un jeu de test ?",["Évaluer la généralisation","Embellir","Accélérer"],0]]},
{id:"ds",t:"Data Science",cat:"Data & ML",lv:"Intermédiaire",d:"28 h",p:269,pre:"Python",obj:"Analyser et visualiser des données.",mods:["Nettoyage","Exploration","Visualisation"],proj:"Tableau de bord analytique",q:[["Étape avant l’analyse ?",["Nettoyer les données","Ignorer les valeurs","Publier"],0]]},
{id:"agents",t:"Développement d’agents IA",cat:"Développement",lv:"Avancé",d:"26 h",p:329,pre:"Python, API",obj:"Concevoir des agents qui utilisent des outils.",mods:["Architecture d’agent","Outils et mémoire","Sécurité"],proj:"Agent de recherche documentaire",q:[["Un agent IA peut…",["Appeler des outils","Rien","Seulement chanter"],0]]},
{id:"api",t:"Intégration des API",cat:"Développement",lv:"Intermédiaire",d:"18 h",p:219,pre:"Notions de programmation",obj:"Intégrer des API d’IA dans des applications.",mods:["REST et JSON","Authentification","Gestion d’erreurs"],proj:"Application connectée à une API d’IA",q:[["Où stocker une clé d’API ?",["Dans le code public","Côté serveur, secrète","Sur un forum"],1]]}];
const BLOG=[["Bien démarrer avec les assistants IA","Outils","Les bases pour utiliser Claude et ChatGPT avec méthode."],["Prompt engineering : 5 réflexes","Tutoriels","Contexte, format, exemples, contraintes, itération."],["Agents IA : promesses et limites","Innovation","Ce que les agents savent faire aujourd’hui."]];
const FAQ=[["Les formations sont-elles reconnues officiellement ?","Non : ce site est une démonstration. Aucun diplôme reconnu n’est annoncé."],["Comment fonctionne le paiement ?","Paiement simulé ici ; l’architecture est prévue pour brancher Stripe et des solutions locales."],["Puis-je suivre à mon rythme ?","Oui, la progression est enregistrée dans votre espace."]];
const L=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||"null"):localStorage.setItem(k,JSON.stringify(v));
let U=()=>{try{return L("nova_me")}catch(e){return null}};
const users=()=>L("nova_users")||[{e:"admin@demo.fr",p:"admin",n:"Admin Démo",r:"admin",c:{},fav:[],done:[]},{e:"formateur@demo.fr",p:"demo",n:"Formateur Démo",r:"formateur",c:{},fav:[],done:[]}];
const save=u=>{const a=users().filter(x=>x.e!==u.e);a.push(u);L("nova_users",a);L("nova_me",u.e)};
const me=()=>{const e=U();return users().find(x=>x.e===e)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const prog=(u,id)=>{const c=C.find(x=>x.id===id);const s=u.c[id]||{l:[],q:null};return Math.round((s.l.length+(s.q!==null?1:0))/(c.mods.length+1)*100)};
function nav(){const u=me();$("#nv").innerHTML=(u?`<a class="l" href="#espace">Mon espace</a><a class="l" href="#" onclick="out();return false">Déconnexion</a>`:`<a class="l" href="#connexion">Connexion</a><a class="btn gold" href="#connexion?s=1">S’inscrire</a>`)}
function out(){localStorage.removeItem("nova_me");location.hash="#accueil";route()}
function head(t,s){return`<section class="sec alt"><div class="wrap fade"><h1>${t}</h1><p style="color:var(--mut)">${s||""}</p></div></section>`}
const P={
accueil:()=>`<section class="hero"><div class="wrap fade"><span class="eyebrow">École d’intelligence artificielle</span><h1>Transformez votre avenir grâce à l’intelligence artificielle</h1><p>Des parcours progressifs, des projets concrets et une plateforme d’apprentissage complète, du premier prompt à l’agent IA.</p><p><a class="btn gold" href="#connexion?s=1">S’inscrire</a> <a class="btn ghost" style="color:#fff;border-color:#ffffff66" href="#formations">Voir les formations</a></p></div></section>
<section class="sec"><div class="wrap"><div class="grid">${[["Mission","Rendre l’IA compréhensible et utile à tous."],["Objectifs","Compétences pratiques, projets, progression mesurée."],["Valeurs","Rigueur, éthique, transparence, exigence."],["Avantages","Cours à votre rythme, quiz, certificats de réussite internes."]].map(x=>`<div class="card"><h3>${x[0]}</h3><p style="color:var(--mut)">${x[1]}</p></div>`).join("")}</div></div></section>
<section class="sec alt"><div class="wrap"><span class="tag demo">Statistiques de démonstration (configurables)</span><div class="grid" id="st"></div></div></section>
<section class="sec"><div class="wrap"><h2>Témoignages</h2><div class="grid">${["Parcours clair et progressif.","Les projets m’ont aidé à appliquer l’IA.","Plateforme simple à utiliser."].map((t,i)=>`<div class="card"><span class="tag demo">Exemple fictif</span><p>« ${t} »</p><small style="color:var(--mut)">Étudiant fictif ${i+1}</small></div>`).join("")}</div></div></section>
<section class="sec alt"><div class="wrap"><h2>Questions fréquentes</h2>${FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}</div></section>`,
ecole:()=>head("Notre école","Une école pensée comme un lieu d’exigence et d’innovation.")+`<section class="sec"><div class="wrap"><p>NOVA AI ACADEMY est un projet de formation à l’IA. Les informations de cette page sont des textes de démonstration à adapter.</p><h2>Pionniers de l’intelligence artificielle</h2><div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="pf" role="img" aria-label="Emplacement du portrait de Dario Amodei">DA</div><div style="flex:1;min-width:240px"><h3>Dario Amodei</h3><p>Cofondateur et PDG d’Anthropic, figure du développement de l’IA et de la recherche sur sa sécurité.</p><small style="color:var(--mut)">Cette présentation est purement éditoriale. Dario Amodei et Anthropic ne sont pas associés à NOVA AI ACADEMY. Remplacez l’emplacement par un portrait dont vous détenez les droits.</small></div></div></div></section>`,
formations:()=>head("Catalogue de formations","Filtrez par catégorie et niveau.")+`<section class="sec"><div class="wrap"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><label>Recherche<input id="fq" oninput="fl()" placeholder="Mot-clé"></label><label>Catégorie<select id="fc" onchange="fl()"><option value="">Toutes</option>${[...new Set(C.map(c=>c.cat))].map(x=>`<option>${x}</option>`).join("")}</select></label><label>Niveau<select id="fv" onchange="fl()"><option value="">Tous</option><option>Débutant</option><option>Intermédiaire</option><option>Avancé</option></select></label></div><div class="grid" id="cl"></div></div></section>`,
blog:()=>head("Blog","Actualités, outils et tutoriels sur l’IA.")+`<section class="sec"><div class="wrap grid">${BLOG.map(b=>`<article class="card"><span class="tag">${b[1]}</span><h3>${b[0]}</h3><p style="color:var(--mut)">${b[2]}</p><span class="tag demo">Article d’exemple</span></article>`).join("")}</div></section>`,
contact:()=>head("Contact","Nous vous répondons rapidement.")+`<section class="sec"><div class="wrap grid"><form class="card" onsubmit="return ct(event)"><label>Nom<input required name="n"></label><label>E-mail<input required type="email" name="e"></label><label>Message<textarea required rows="4" name="m"></textarea></label><button class="btn">Envoyer</button><p id="cm" role="status"></p></form><div class="card"><p>E-mail : contact@exemple.fr<br>Téléphone : +33 0 00 00 00 00<br>Réseaux : LinkedIn · X · YouTube</p><span class="tag demo">Coordonnées à remplacer</span></div></div></section>`,
connexion:()=>{const s=location.hash.includes("s=1");return head(s?"Créer un compte":"Connexion","Plateforme étudiante, formateur et administrateur.")+`<section class="sec"><div class="wrap" style="max-width:480px"><form class="card" onsubmit="return au(event,${s})">${s?`<label>Nom complet<input name="n" required></label>`:""}<label>E-mail<input name="e" type="email" required></label><label>Mot de passe<input name="p" type="password" required minlength="4"></label><button class="btn">${s?"S’inscrire":"Se connecter"}</button> <a href="#connexion${s?"":"?s=1"}">${s?"J’ai déjà un compte":"Créer un compte"}</a><p id="am" role="alert" style="color:#b3261e"></p><small style="color:var(--mut)">Démo : comptes stockés dans ce navigateur. Essais : admin@demo.fr / admin, formateur@demo.fr / demo.</small></form></div></section>`},
espace:()=>{const u=me();if(!u)return go("connexion");if(u.r==="admin")return go("admin");if(u.r==="formateur")return go("formateur");const mine=Object.keys(u.c);return head(`Bonjour ${esc(u.n)}`,"Votre tableau de bord")+`<section class="sec"><div class="wrap"><h2>Mes formations</h2><div class="grid">${mine.map(id=>{const c=C.find(x=>x.id===id);return`<div class="card"><h3>${c.t}</h3><div class="bar"><i style="width:${prog(u,id)}%"></i></div><p>${prog(u,id)} %</p><a class="btn" href="#cours-${id}">Continuer</a> ${prog(u,id)===100?`<a class="btn gold" href="#cert-${id}">Certificat</a>`:""}</div>`}).join("")||`<p>Aucune formation. <a href="#formations">Parcourir le catalogue</a></p>`}</div>
<h2 style="margin-top:32px">Terminées : ${mine.filter(i=>prog(u,i)===100).length} · Favoris : ${u.fav.length}</h2><div class="grid">${u.fav.map(id=>`<a class="card" href="#formation-${id}">★ ${C.find(x=>x.id===id).t}</a>`).join("")}</div>
<h2 style="margin-top:32px">Résultats aux quiz</h2><div class="tbl"><table>${mine.map(id=>`<tr><td>${C.find(x=>x.id===id).t}</td><td>${u.c[id].q===null?"—":u.c[id].q+" %"}</td></tr>`).join("")}</table></div>
<h2 style="margin-top:32px">Paramètres</h2><form class="card" onsubmit="return pn(event)"><label>Nom<input name="n" value="${esc(u.n)}"></label><button class="btn">Enregistrer</button></form></div></section>`},
formateur:()=>{const u=me();if(!u||u.r==="etudiant")return go("connexion");return head("Espace formateur","Gestion des cours (maquette fonctionnelle de démonstration)")+`<section class="sec"><div class="wrap"><div class="tbl"><table><tr><th>Cours</th><th>Modules</th><th>Vidéos</th><th>Documents</th><th>Étudiants</th></tr>${C.map(c=>`<tr><td>${c.t}</td><td>${c.mods.length}</td><td>${c.mods.length}</td><td>1</td><td>${users().filter(x=>x.c[c.id]).length}</td></tr>`).join("")}</table></div><p style="color:var(--mut)">L’import de vidéos et de PDF utilisera Supabase Storage lors du déploiement avec backend.</p></div></section>`},
admin:()=>{const u=me();if(!u||u.r!=="admin")return go("connexion");const us=users();const rev=us.reduce((s,x)=>s+Object.keys(x.c).reduce((a,i)=>a+C.find(c=>c.id===i).p,0),0);return head("Espace administrateur","Utilisateurs, inscriptions, paiements, statistiques")+`<section class="sec"><div class="wrap"><div class="grid"><div class="card"><div class="stat">${us.length}</div>Utilisateurs</div><div class="card"><div class="stat">${us.reduce((s,x)=>s+Object.keys(x.c).length,0)}</div>Inscriptions</div><div class="card"><div class="stat">${rev} €</div>Paiements (simulés)</div></div><div class="tbl"><table><tr><th>Nom</th><th>E-mail</th><th>Rôle</th><th>Formations</th></tr>${us.map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.e)}</td><td>${x.r}</td><td>${Object.keys(x.c).length}</td></tr>`).join("")}</table></div></div></section>`},
legal:p=>head({mentions:"Mentions légales",cgv:"Conditions générales de vente",confidentialite:"Politique de confidentialité",cookies:"Cookies"}[p]||"Légal")+`<section class="sec"><div class="wrap"><p>Modèle à compléter avec les informations réelles de votre structure (raison sociale, adresse, hébergeur, responsable de traitement) et à faire valider par un juriste avant publication.</p></div></section>`};
function go(h){location.hash="#"+h;return""}
function fl(){const q=$("#fq").value.toLowerCase(),c=$("#fc").value,v=$("#fv").value;$("#cl").innerHTML=C.filter(x=>(!c||x.cat===c)&&(!v||x.lv===v)&&x.t.toLowerCase().includes(q)).map(x=>`<a class="card" href="#formation-${x.id}" style="text-decoration:none;color:inherit"><span class="tag">${x.cat}</span><span class="tag">${x.lv}</span><h3>${x.t}</h3><p style="color:var(--mut)">${x.obj}</p><b>${x.p} €</b> · ${x.d}</a>`).join("")||"<p>Aucun résultat.</p>"}
function detail(id){const c=C.find(x=>x.id===id);if(!c)return"<p class='wrap'>Introuvable</p>";const u=me();return head(c.t,c.obj)+`<section class="sec"><div class="wrap"><span class="tag">${c.cat}</span><span class="tag">${c.lv}</span><span class="tag">${c.d}</span><p><b>Prérequis :</b> ${c.pre}</p><h3>Modules</h3><ol>${c.mods.map(m=>`<li>${m}</li>`).join("")}</ol><p><b>Projet pratique :</b> ${c.proj}</p><p class="stat">${c.p} €</p><button class="btn gold" onclick="pay('${c.id}')">S’inscrire à cette formation</button> ${u?`<button class="btn ghost" onclick="fav('${c.id}')">★ Favori</button>`:""}</div></section>`}
function course(id){const u=me(),c=C.find(x=>x.id===id);if(!u)return go("connexion");if(!u.c[id])return go("formation-"+id);const s=u.c[id];return head(c.t,`Progression : ${prog(u,id)} %`)+`<section class="sec"><div class="wrap"><div class="bar"><i style="width:${prog(u,id)}%"></i></div><h2>Leçons</h2>${c.mods.map((m,i)=>`<details><summary>${s.l.includes(i)?"✓ ":""}Leçon ${i+1} — ${m}</summary><p>Contenu de démonstration de la leçon. La vidéo et le PDF du module seront servis depuis Supabase Storage.</p><button class="btn" onclick="les('${id}',${i})">Marquer comme terminée</button></details>`).join("")}<h2>Quiz</h2><form class="card" onsubmit="return qz(event,'${id}')">${c.q.map((q,i)=>`<fieldset style="border:0;padding:0"><legend><b>${q[0]}</b></legend>${q[1].map((o,j)=>`<label style="display:block"><input type="radio" name="q${i}" value="${j}" style="width:auto" required> ${o}</label>`).join("")}</fieldset>`).join("")}<button class="btn">Valider le quiz</button> <span id="qr" role="status"></span></form></div></section>`}
function cert(id){const u=me(),c=C.find(x=>x.id===id);if(!u||prog(u,id)<100)return go("espace");return`<section class="sec"><div class="wrap"><div class="cert"><p class="eyebrow">NOVA AI ACADEMY</p><h1>Certificat de réussite</h1><p>décerné à</p><h2>${esc(u.n)}</h2><p>pour la formation « ${c.t} »</p><small>Attestation interne de démonstration, non reconnue officiellement — ${new Date().toLocaleDateString("fr-FR")}</small></div><p class="noprint"><button class="btn gold" onclick="print()">Imprimer / enregistrer en PDF</button></p></div></section>`}
function pay(id){const u=me();if(!u){go("connexion?s=1");return}const c=C.find(x=>x.id===id);$("#md").innerHTML=`<div class="modal" onclick="if(event.target===this)this.innerHTML=''"><div role="dialog" aria-modal="true"><h3>Paiement — ${c.t}</h3><p>${c.p} €</p><p style="color:var(--mut)">Paiement simulé. Point d’intégration prévu : Stripe Checkout ou passerelle locale, avec confirmation côté serveur.</p><button class="btn gold" onclick="ok('${id}')">Payer (simulation)</button> <button class="btn ghost" onclick="$('#md').innerHTML=''">Annuler</button></div></div>`}
function ok(id){const u=me();u.c[id]=u.c[id]||{l:[],q:null};save(u);$("#md").innerHTML="";go("cours-"+id)}
function fav(id){const u=me();u.fav=u.fav.includes(id)?u.fav.filter(x=>x!==id):[...u.fav,id];save(u);alert("Favoris mis à jour")}
function les(id,i){const u=me();if(!u.c[id].l.includes(i))u.c[id].l.push(i);save(u);route()}
function qz(e,id){e.preventDefault();const c=C.find(x=>x.id===id),f=new FormData(e.target);let g=0;c.q.forEach((q,i)=>{if(+f.get("q"+i)===q[2])g++});const sc=Math.round(g/c.q.length*100),u=me();u.c[id].q=sc;save(u);$("#qr").textContent=`Score : ${sc} %`;setTimeout(route,900);return false}
function au(e,s){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const all=users();const ex=all.find(x=>x.e===f.e);if(s){if(ex){$("#am").textContent="Compte existant.";return false}save({e:f.e,p:f.p,n:f.n,r:"etudiant",c:{},fav:[],done:[]})}else{if(!ex||ex.p!==f.p){$("#am").textContent="Identifiants incorrects.";return false}if(!L("nova_users"))L("nova_users",all);L("nova_me",ex.e)}go("espace");return false}
function pn(e){e.preventDefault();const u=me();u.n=new FormData(e.target).get("n");save(u);route();return false}
function ct(e){e.preventDefault();const a=L("nova_msgs")||[];a.push(Object.fromEntries(new FormData(e.target)));L("nova_msgs",a);$("#cm").textContent="Message enregistré (démo). Merci !";e.target.reset();return false}
function route(){const h=(location.hash||"#accueil").slice(1).split("?")[0];let r;if(h.startsWith("formation-"))r=detail(h.slice(10));else if(h.startsWith("cours-"))r=course(h.slice(6));else if(h.startsWith("cert-"))r=cert(h.slice(5));else if(h.startsWith("legal-"))r=P.legal(h.slice(6));else r=(P[h]||P.accueil)();if(r===""||r===undefined)return;$("#app").innerHTML=r;document.querySelectorAll("nav a.l").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h));nav();if(h==="formations")fl();if(h==="accueil")$("#st").innerHTML=[["1 200+","Apprenants (exemple)"],["11","Formations"],["94 %","Satisfaction (exemple)"],["4","Parcours"]].map(x=>`<div class="card"><div class="stat">${x[0]}</div>${x[1]}</div>`).join("");scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
